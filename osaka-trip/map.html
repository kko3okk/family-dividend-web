<style>
* { box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f5f4f0; color:#1a1a1a; }
header { padding:12px 16px 8px; }
h1 { font-size:16px; font-weight:600; }
.sub { font-size:12px; color:#999; margin-top:2px; }
.bar { display:flex; gap:6px; overflow-x:auto; padding:10px 16px 12px; -webkit-overflow-scrolling:touch; }
.bar::-webkit-scrollbar { display:none; }
.chip { flex:0 0 auto; font-size:12px; font-weight:600; padding:6px 12px; border-radius:20px; cursor:pointer;
        border:1.5px solid transparent; background:#fff; color:#666; white-space:nowrap; transition:.15s; }
.chip.on { color:#fff; }
.chip.all { border-color:#1a1a1a; }
.chip.all.on { background:#1a1a1a; }
#map { height: calc(100vh - 132px); width:100%; }
.leaflet-popup-content-wrapper { border-radius:12px; }
.leaflet-popup-content { margin:12px 14px; font-size:13px; line-height:1.6; min-width:190px; }
.pop-day { display:inline-block; font-size:10px; font-weight:600; color:#fff; padding:2px 8px; border-radius:10px; margin-bottom:6px; }
.pop-name { font-size:14px; font-weight:600; margin-bottom:4px; }
.pop-meta { font-size:11px; color:#888; line-height:1.5; }
.pop-note { font-size:11px; color:#555; margin-top:5px; }
.pop-link { display:inline-block; margin-top:8px; font-size:11px; font-weight:600; color:#1a6fd4; text-decoration:none; }
.pin { border-radius:50% 50% 50% 0; transform:rotate(-45deg); border:2px solid #fff;
       box-shadow:0 1px 4px rgba(0,0,0,.4); width:22px; height:22px; }
.pin span { transform:rotate(45deg); display:block; text-align:center; line-height:18px; font-size:10px; font-weight:700; color:#fff; }
.pin.hotel { border-radius:6px; transform:none; width:26px; height:26px; }
.pin.hotel span { transform:none; line-height:22px; font-size:13px; }
</style>

  m:'⭐4.5(6151)｜10/19–21',note:'走路5分到USJ入口｜有大浴場｜⚠️退房11:00'},

 // ── D4
 {d:'D4',n:'環球影城 USJ',lat:34.6656768,lng:135.4323185,i:'🎢',

 {d:'D7',n:'忍鬨 燒肉',lat:34.6726591,lng:135.505157,i:'🔥',

const map = L.map('map',{zoomControl:true}).setView([34.668,135.502],13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:19
}).addTo(map);

const layers = {};
Object.keys(DAYS).forEach(k=>layers[k]=L.layerGroup().addTo(map));

P.forEach(p=>{
  const col = DAYS[p.d].c;
  const icon = L.divIcon({
    className:'',
    html:`<div class="pin ${p.hotel?'hotel':''}" style="background:${col}"><span>${p.i}</span></div>`,
    iconSize:[22,22], iconAnchor:[11,22], popupAnchor:[0,-22]
  });
  const gmap = `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
  const html = `<div><span class="pop-day" style="background:${col}">${DAYS[p.d].t}</span>
    <div class="pop-name">${p.n}</div>
    <div class="pop-meta">${p.m}</div>
    ${p.note?`<div class="pop-note">${p.note}</div>`:''}
    <a class="pop-link" href="${gmap}" target="_blank" rel="noopener">在 Google Maps 開啟 ↗</a></div>`;
  L.marker([p.lat,p.lng],{icon}).bindPopup(html).addTo(layers[p.d]);
});

// 篩選列
const bar = document.getElementById('bar');
function mkChip(key,label,color,on){
  const b=document.createElement('div');
  b.className='chip'+(key==='ALL'?' all':'')+(on?' on':'');
  b.textContent=label;
  if(key!=='ALL'){ b.style.borderColor=color; if(on) b.style.background=color; }
  b.onclick=()=>select(key);
  bar.appendChild(b); return b;
}
const chips={};
chips.ALL=mkChip('ALL','全部','#1a1a1a',true);
Object.entries(DAYS).forEach(([k,v])=>chips[k]=mkChip(k,v.t,v.c,false));

function select(key){
  Object.entries(chips).forEach(([k,el])=>{
    const on = (key==='ALL') ? (k==='ALL') : (k===key);
    el.classList.toggle('on',on);
    if(k!=='ALL') el.style.background = on ? DAYS[k].c : '#fff';
  });
  const pts=[];
  Object.keys(DAYS).forEach(k=>{
    const show = (key==='ALL'||key===k);
    if(show){ layers[k].addTo(map); } else { map.removeLayer(layers[k]); }
    if(show) P.filter(p=>p.d===k).forEach(p=>pts.push([p.lat,p.lng]));
  });
  if(pts.length) map.fitBounds(L.latLngBounds(pts),{padding:[45,45],maxZoom:16});
}
select('ALL');
