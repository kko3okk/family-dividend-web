name: otcdiag
on:
  push:
    paths: ["otcdiag.py"]
permissions: {contents: write}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 otcdiag.py
      - run: |
          git config user.name bot; git config user.email b@b.c
          git pull --rebase || true
          git add validate; git diff --cached --quiet || git commit -m otcdiag; git push
