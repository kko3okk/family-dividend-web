name: validate-screen

on:
  workflow_dispatch:
  push:
    paths:
      - "validate_screen.py"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: run validation
        run: python3 validate_screen.py
      - name: commit results
        run: |
          git config user.name "revenue-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/revenue validate
          git diff --cached --quiet || git commit -m "validate screen $(date +%F)"
          git push
