name: sim2026
on:
  workflow_dispatch:
  push:
    paths: ["sim2026.py"]
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 sim2026.py
      - run: |
          git config user.name bot; git config user.email b@b.c
          git add data/prices sim; git diff --cached --quiet || git commit -m "sim 2026"; git push
