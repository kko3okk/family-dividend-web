name: fut
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          mkdir -p data/fut
          python3 - << 'PY' 2>&1 | tee data/fut/log.txt
          import json,urllib.request,urllib.parse,datetime
          HDR={"User-Agent":"Mozilla/5.0","Content-Type":"application/x-www-form-urlencoded"}
          def post(u,data):
              try:
                  r=urllib.request.Request(u,data=urllib.parse.urlencode(data).encode(),headers=HDR)
                  return urllib.request.urlopen(r,timeout=90).read().decode("big5-hkscs","ignore")
              except Exception as e: print("fail",e); return None
          # 三大法人臺股期貨未平倉：2026/1/1 - 今日，分月抓
          rows=[]
          d0=datetime.date(2026,1,1); today=datetime.date.today()
          m=d0
          while m<=today:
              nxt=(m.replace(day=28)+datetime.timedelta(days=6)).replace(day=1)
              e=min(nxt-datetime.timedelta(days=1),today)
              t=post("https://www.taifex.com.tw/cht/3/futContractsDateDown",
                     {"queryStartDate":m.strftime("%Y/%m/%d"),"queryEndDate":e.strftime("%Y/%m/%d"),"commodityId":"TXF"})
              if t and "日期" in t:
                  ls=[l for l in t.split("\n") if l.strip() and not l.startswith("日期")]
                  rows+=ls; print(m,"->",e,len(ls),"rows")
              m=nxt
          open("data/fut/txf_history.csv","w").write("日期,商品名稱,身份別,多方交易口數,多方交易契約金額,空方交易口數,空方交易契約金額,多空交易口數淨額,多空交易契約金額淨額,多方未平倉口數,多方未平倉契約金額,空方未平倉口數,空方未平倉契約金額,多空未平倉口數淨額,多空未平倉契約金額淨額\n"+"\n".join(rows))
          print("total",len(rows))
          PY
      - run: |
          git config user.name bot; git config user.email b@b.c
          git add data/fut
          git diff --cached --quiet && exit 0
          git commit -m "fut data"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
