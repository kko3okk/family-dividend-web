name: ohlc
on:
  workflow_dispatch:
    inputs:
      codes:
        description: "股票代號，逗號分隔"
        required: true
        default: "3006"
permissions: {contents: write}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: fetch OHLC
        env:
          CODES: ${{ github.event.inputs.codes }}
        run: |
          mkdir -p data/ohlc
          python3 - << 'PY' 2>&1 | tee data/ohlc/log.txt
          import json,os,re,time,urllib.request
          HDR={"User-Agent":"Mozilla/5.0"}
          def f(x):
              try: return float(str(x).replace(",",""))
              except: return None
          os.makedirs("data/ohlc",exist_ok=True)
          for code in [c.strip() for c in os.environ["CODES"].split(",") if c.strip()]:
              out={}
              for ym in ["202601","202602","202603","202604","202605","202606","202607","202608","202609"]:
                  u=f"https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY?date={ym}01&stockNo={code}&response=json"
                  try:
                      j=json.loads(urllib.request.urlopen(urllib.request.Request(u,headers=HDR),timeout=60).read().decode())
                  except Exception as e:
                      print("fail",ym,type(e).__name__,e); time.sleep(3); continue
                  print("stat",ym,j.get("stat"),"keys",list(j.keys())[:6],"rows",len(j.get("data") or []))
                  if not (j.get("data") or []):
                      print("  raw head:",str(j)[:300])
                  for r in j.get("data") or []:
                      m=re.match(r"(\d+)/(\d+)/(\d+)",r[0])
                      if not m: continue
                      d=f"{int(m.group(1))+1911}-{int(m.group(2)):02d}-{int(m.group(3)):02d}"
                      o,h,l,c=f(r[3]),f(r[4]),f(r[5]),f(r[6])
                      if None in (o,h,l,c): continue
                      out[d]=dict(o=o,h=h,l=l,c=c,v=f(r[1]) or 0)
                  print(code,ym,len(j.get("data") or []))
                  time.sleep(3)
              json.dump(dict(sorted(out.items())),open(f"data/ohlc/{code}.json","w"))
              print("wrote",code,len(out),"days")
          PY
      - run: |
          git config user.name bot; git config user.email b@b.c
          git add data/ohlc
          git diff --cached --quiet && exit 0
          git commit -m "ohlc"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
