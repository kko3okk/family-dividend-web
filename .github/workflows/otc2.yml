name: otc2-sim
on:
  push:
    paths: ["sim_otc2.py"]
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 sim_otc2.py
      - run: |
          git config user.name bot; git config user.email b@b.c
          git pull --rebase || true
          git add sim data/prices_otc2; git diff --cached --quiet || git commit -m "otc2 sim"; git push
