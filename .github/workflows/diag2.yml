name: diag2
on:
  push:
    paths: ["diag2.py"]
permissions: {contents: write}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 diag2.py
      - run: |
          git config user.name bot; git config user.email b@b.c
          git add validate; git diff --cached --quiet || git commit -m diag2; git push
