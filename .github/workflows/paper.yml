name: paper-daily
on:
  schedule:
    - cron: "30 7 * * 1-5"    # 台灣 15:30 收盤後
  workflow_dispatch:
  push:
    paths: ["paper/paper.json","paper_update.py"]
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: refresh prices (今日)
        run: |
          python3 - << 'PY'
          import json,re,os,datetime,urllib.request,time
          HDR={"User-Agent":"Mozilla/5.0"}
          def tof(x):
              try: return float(str(x).replace(",",""))
              except: return None
          def fetch(d):
              u=f"https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date={d.strftime('%Y%m%d')}&type=ALL&response=json"
              try: j=json.loads(urllib.request.urlopen(urllib.request.Request(u,headers=HDR),timeout=60).read().decode())
              except Exception: return None
              px={}; tx=None
              for tb in j.get("tables",[]):
                  f=tb.get("fields",[])
                  if "證券代號" in f and "收盤價" in f:
                      ci,pi=f.index("證券代號"),f.index("收盤價"); vi=f.index("成交股數") if "成交股數" in f else None
                      for r in tb.get("data",[]):
                          c=re.sub(r"[^0-9A-Za-z]","",r[ci]); v=tof(r[pi])
                          if re.fullmatch(r"\d{4}",c) and v: px[c]=[v, tof(r[vi]) if vi is not None else 0]
                  if f and "指數" in f[0]:
                      for r in tb.get("data",[]):
                          if "發行量加權股價指數" in r[0]: tx=tof(r[1])
              return {"px":px,"taiex":tx} if px else None
          today=datetime.date.today()
          for back in range(0,7):
              d=today-datetime.timedelta(days=back)
              if d.weekday()>=5: continue
              p=f"data/prices/{d.strftime('%Y%m')}.json"
              m=json.load(open(p)) if os.path.exists(p) else {}
              if d.isoformat() in m: continue
              r=fetch(d); time.sleep(3)
              if r:
                  m[d.isoformat()]=r; json.dump(m,open(p,"w")); print("added",d)
          PY
      - name: refresh OTC prices (今日, 櫃買 → data/prices_otc2)
        run: |
          python3 - << 'PY'
          import json,re,os,datetime,urllib.request,time
          HDR={"User-Agent":"Mozilla/5.0"}
          def tof(x):
              try: return float(str(x).replace(",","").replace("%",""))
              except: return None
          def fetch_otc(d):
              u=f"https://www.tpex.org.tw/www/zh-tw/afterTrading/otc?date={d.strftime('%Y/%m/%d')}&type=EW&response=json"
              try: j=json.loads(urllib.request.urlopen(urllib.request.Request(u,headers=HDR),timeout=60).read().decode("utf-8","ignore"))
              except Exception: return None
              px={}
              for tb in j.get("tables",[]):
                  f=[x.strip() for x in tb.get("fields",[])]
                  if "代號" not in f: continue
                  ci=f.index("代號")
                  pi=[k for k,x in enumerate(f) if x.startswith("收盤")][0]
                  vi=[k for k,x in enumerate(f) if x.startswith("成交股數")][0]
                  for r in tb.get("data",[]):
                      c=str(r[ci]).strip()
                      if re.fullmatch(r"\d{4}",c) and tof(r[pi]): px[c]=[tof(r[pi]), tof(r[vi]) or 0]
              return px or None
          os.makedirs("data/prices_otc2",exist_ok=True)
          today=datetime.date.today()
          for back in range(0,7):
              d=today-datetime.timedelta(days=back)
              if d.weekday()>=5: continue
              p=f"data/prices_otc2/{d.strftime('%Y%m')}.json"
              m=json.load(open(p,encoding="utf-8")) if os.path.exists(p) else {}
              if d.isoformat() in m: continue
              r=fetch_otc(d); time.sleep(3)
              if r:
                  m[d.isoformat()]=r; json.dump(m,open(p,"w",encoding="utf-8")); print("added otc",d)
          PY
      - name: refresh monthly revenue (OpenAPI；未翻頁時改抓 MOPS 月報彙總)
        run: |
          mkdir -p paper
          python3 - << 'PY' 2>&1 | tee paper/revenue_log.txt
          import json,os,re,datetime,urllib.request,html
          HDR={"User-Agent":"Mozilla/5.0","Accept":"*/*"}
          def raw(u,enc=None):
              try:
                  b=urllib.request.urlopen(urllib.request.Request(u,headers=HDR),timeout=60).read()
                  return b.decode(enc,"ignore") if enc else b
              except Exception as e: print("fail",u,e); return None
          def f(x):
              try: return float(str(x).replace(",","").strip())
              except: return None
          bym={}
          def put(ym,c,name,mkt,ind,rev,yoy,cum,note):
              bym.setdefault(ym,{})[c]=dict(code=c,name=name,market=mkt,industry=ind,ym=ym,revenue=rev,yoy=yoy,cum=cum,note=(note or "-").strip() or "-")
          # --- 1) OpenAPI ---
          for mkt,u in [("上市","https://openapi.twse.com.tw/v1/opendata/t187ap05_L"),("上櫃","https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap05_O")]:
              b=raw(u)
              if not b: continue
              try: rows=json.loads(b.decode("utf-8","ignore"))
              except Exception: rows=[]
              for r in rows:
                  ym=str(r.get("資料年月","")).strip(); c=str(r.get("公司代號","")).strip()
                  if re.fullmatch(r"\d{5}",ym) and re.fullmatch(r"\d{4}",c):
                      put(ym,c,r.get("公司名稱","").strip(),mkt,r.get("產業別","").strip(),f(r.get("營業收入-當月營收")),
                          f(r.get("營業收入-去年同月增減(%)")),f(r.get("累計營業收入-前期比較增減(%)")),r.get("備註"))
          # --- 2) MOPS 月報彙總（上月），OpenAPI 尚未翻頁時使用 ---
          today=datetime.date.today(); pm=today.replace(day=1)-datetime.timedelta(days=1)
          target=f"{pm.year-1911}{pm.month:02d}"
          if target not in bym:
              for mkt,seg in [("上市","sii"),("上櫃","otc")]:
                  t=None
                  for host in ["https://mopsov.twse.com.tw","https://mops.twse.com.tw"]:
                      for mm in [pm.month, pm.month-1]:   # 第二個只為診斷路徑是否存在
                          u=f"{host}/nas/t21/{seg}/t21sc03_{pm.year-1911}_{mm}_0.html"
                          t=raw(u,"big5-hkscs")
                          if t: print("ok",u); break
                      if t: break
                  if not t: continue
                  print("mops page",mkt,len(t),"chars; tables:",t.count("<table"),"; sample:",re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",t))[:300])
                  t=html.unescape(t); n=0
                  for tb in re.findall(r"<table[^>]*>(.*?)</table>",t,re.S):
                      ind=""
                      m=re.search(r"產業別：([^<]+)",tb)
                      if m: ind=m.group(1).strip()
                      for tr in re.findall(r"<tr[^>]*>(.*?)</tr>",tb,re.S):
                          td=[re.sub(r"<[^>]+>","",x).strip() for x in re.findall(r"<td[^>]*>(.*?)</td>",tr,re.S)]
                          if len(td)>=10 and re.fullmatch(r"\d{4}",td[0]):
                              put(target,td[0],td[1],mkt,ind,f(td[2]),f(td[6]),f(td[9]),td[10] if len(td)>10 else "-"); n+=1
                  print("mops",mkt,target,n,"rows")
          # --- 寫檔（只更新 >= 現有最新月份）---
          os.makedirs("data/revenue",exist_ok=True)
          have=sorted(x[:-5] for x in os.listdir("data/revenue") if x.endswith(".json"))
          for ym,rows in bym.items():
              if have and ym<have[-1]: continue
              p=f"data/revenue/{ym}.json"
              old={r["code"]:r for r in json.load(open(p,encoding="utf-8"))} if os.path.exists(p) else {}
              old.update(rows); out=sorted(old.values(),key=lambda r:r["code"])
              json.dump(out,open(p,"w",encoding="utf-8"),ensure_ascii=False); print("revenue",ym,len(out),"rows")
          PY
      - run: python3 paper_update.py
      - run: python3 candidates.py
      - run: |
          git config user.name bot; git config user.email b@b.c
          git add data/prices data/prices_otc2 data/revenue paper; git diff --cached --quiet || git commit -m "paper $(date +%F)"; git push
