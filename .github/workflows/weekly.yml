name: daily-research
on:
  schedule:
    - cron: "17 20 * * *"    # 每天 台灣 04:17 開跑（GitHub 排程常延遲 1–2.5 小時，約 06:00 前後完成）
  workflow_dispatch:
permissions: {contents: write}
jobs:
  r:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: backfill prices (paper 作業漏跑時補抓)
        continue-on-error: true
        run: python3 scripts/refresh_prices.py
      - env: {FM: "${{ secrets.FINMIND_TOKEN }}"}
        run: |
          mkdir -p research
          python3 - << 'PY' 2>&1 | tee research/log.txt
          import json,os,time,datetime,urllib.request,urllib.parse,statistics,glob
          FM=os.environ["FM"]; HDR={"User-Agent":"Mozilla/5.0"}
          B="https://raw.githubusercontent.com/kko3okk/family-dividend-web/main/"
          def get(u):
              return json.loads(urllib.request.urlopen(urllib.request.Request(u,headers=HDR),timeout=90).read().decode())
          SUB=get(B+"data/subindustry.json")
          codes=sorted({c for v in SUB.values() for c in v}|{"3707","3016","6488","3211","6548","5285","2481","6693","3026","2301","2308","2351"})
          c2s={c:k for k,cs in SUB.items() for c in cs}
          # 1) 毛利率（季報，每季更新；每週重抓成本低）
          p="research/gm.json"
          GM=json.load(open(p)) if os.path.exists(p) else {}
          pe_p="research/eps.json"
          EPS=json.load(open(pe_p)) if os.path.exists(pe_p) else {}
          def fm(cid):
              q=dict(dataset="TaiwanStockFinancialStatements",data_id=cid,start_date="2024-01-01",token=FM)
              try: return get("https://api.finmindtrade.com/api/v4/data?"+urllib.parse.urlencode(q)).get("data",[])
              except Exception as e: return []
          for i,c in enumerate(codes):
              rows=fm(c); by={}
              for r in rows:
                  if r.get("type") in ("GrossProfit","Revenue","EPS"): by.setdefault(r["date"],{})[r["type"]]=r["value"]
              q=[];e=[]
              for dt in sorted(by):
                  g=by[dt].get("GrossProfit"); rv=by[dt].get("Revenue")
                  if g is not None and rv: q.append([dt,round(g/rv*100,2)])
                  if by[dt].get("EPS") is not None: e.append([dt,by[dt]["EPS"]])
              if q: GM[c]=q
              if e: EPS[c]=e
              if i%40==0: print("gm",i,flush=True)
              time.sleep(0.22)
          json.dump(GM,open(p,"w")); json.dump(EPS,open(pe_p,"w"))
          # 1b) 本益比/淨值比（證交所 + 櫃買）
          def tof(x):
              try: return float(str(x).replace(",",""))
              except: return None
          PE={};PB={}
          try:
              j=get("https://www.twse.com.tw/rwd/zh/afterTrading/BWIBBU_d?date=&selectType=ALL&response=json")
              for r in j.get("data",[]):
                  if tof(r[5]): PE[r[0]]=tof(r[5])
                  if tof(r[6]): PB[r[0]]=tof(r[6])
          except Exception as e: print("pe twse fail",e)
          try:
              for r in get("https://www.tpex.org.tw/openapi/v1/tpex_mainboard_peratio_analysis"):
                  v=tof(r.get("PriceEarningRatio")); pb=tof(r.get("PriceBookRatio"))
                  if v and v>0: PE[r["SecuritiesCompanyCode"]]=v
                  if pb: PB[r["SecuritiesCompanyCode"]]=pb
          except Exception as e: print("pe tpex fail",e)
          json.dump({"pe":PE,"pb":PB},open("research/valuation.json","w"))
          print("PE",len(PE),"PB",len(PB))
          # 2) 最新月營收
          revs=sorted(f for f in os.listdir("data/revenue") if f.endswith(".json"))
          cur=json.load(open("data/revenue/"+revs[-1],encoding="utf-8")); prev=json.load(open("data/revenue/"+revs[-2],encoding="utf-8"))
          R={r["code"]:r for r in cur}; P={r["code"]:r for r in prev}
          ym=revs[-1][:-5]
          # 3) 價格
          days={}
          for f in sorted(glob.glob("data/prices/*.json")): days.update(json.load(open(f)))
          otc={}
          for f in sorted(glob.glob("data/prices_otc2/*.json")): otc.update(json.load(open(f)))
          ds=sorted(days); od=sorted(otc)
          def px(c):
              s=[days[x]["px"].get(c,[None])[0] for x in ds]; w=[v for v in s if v]
              if len(w)>=60: return w[-1],sum(w[-20:])/20,sum(w[-60:])/60,max(w[-60:]),days[ds[-1]]["px"].get(c,[0,0])[1]/1000
              s=[otc[x].get(c,[None])[0] for x in od]; w=[v for v in s if v]
              if len(w)>=60: return w[-1],sum(w[-20:])/20,sum(w[-60:])/60,max(w[-60:]),otc[od[-1]].get(c,[0,0])[1]/1000
              return None
          MODEL={'伺服器ODM':'過路費','網通交換器':'過路費','封裝測試':'過路費','記憶體':'租金','機殼導軌':'租金',
           'PCB_CCL':'加工','PCB設備':'加工','散熱':'加工','探針卡測試介面':'加工','半導體設備材料':'加工',
           '晶圓代工':'租金','光通訊_CPO':'加工','IC設計_ASIC':'混合','被動元件':'加工','導線架封裝材料':'加工',
           '連接器線材':'加工','電源':'加工','機器人自動化':'加工','功率半導體':'加工','航運':'循環',
           '檢測分析':'加工','重電電網':'加工'}
          L=[]
          L.append(f"# 產業數據看板（自動更新）\n")
          L.append(f"**更新：{datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).strftime('%Y-%m-%d %H:%M')}　營收月：{ym}　價格日：{ds[-1]}**\n")
          L.append("本檔為 `RESEARCH.md` 的數據面，每天 06:00 自動重算。質化分析（瓶頸成因、供應鏈結構、監控指標）仍在 `RESEARCH.md`，需人工更新。\n")
          L.append("\n## 子產業總表（毛利率＝議價力）\n")
          L.append("| 子產業 | 模式 | 家數 | 毛利率中位 | 近兩季變化 | 當月YoY中位 | 站60MA | 距高中位 |")
          L.append("|---|---|---|---|---|---|---|---|")
          rows=[]
          for sub,cs in SUB.items():
              lv=[];dl=[];ys=[];ab=0;n=0;dh=[]
              for c in cs:
                  g=[v for _,v in GM.get(c,[])]
                  if len(g)>=3: lv.append(g[-1]); dl.append(g[-1]-g[-3])
                  r=R.get(c)
                  if r and r.get("yoy") is not None: ys.append(r["yoy"])
                  t=px(c)
                  if t:
                      n+=1
                      if t[0]>t[2]: ab+=1
                      dh.append((t[0]/t[3]-1)*100)
              if len(lv)<2: continue
              rows.append((statistics.median(dl),sub,len(lv),statistics.median(lv),
                           statistics.median(ys) if ys else 0, ab/n*100 if n else 0,
                           statistics.median(dh) if dh else 0))
          rows.sort(reverse=True)
          for d,sub,nn,lv,y,ab,dh in rows:
              L.append(f"| {sub} | {MODEL.get(sub,'—')} | {nn} | {lv:.1f}% | {d:+.1f}pt | {y:+.0f}% | {ab:.0f}% | {dh:+.1f}% |")
          L.append("\n## 通過第12條草案（毛利率連兩季上升）且技術面合格\n")
          L.append("| 代號 | 名稱 | 子產業 | 模式 | 當月YoY | 累計 | 毛利率三季 | 收盤 | 進場下限 | 出場線 | 停損 | 量(張) |")
          L.append("|---|---|---|---|---|---|---|---|---|---|---|---|")
          cnt=0
          for c in codes:
              r=R.get(c); p=P.get(c)
              if not r or r.get("yoy") is None or not (30<=r["yoy"]<=300): continue
              if not p or p.get("yoy") is None or p["yoy"]<30: continue
              if (r.get("cum") or 0)<30: continue
              g=[v for _,v in GM.get(c,[])]
              if len(g)<3 or not (g[-1]>g[-2]>g[-3]): continue
              t=px(c)
              if not t: continue
              pxx,m20,m60,hi,vol=t
              if not (pxx>m20 and pxx>m60 and (pxx-m20)/m20<0.15 and vol>=500): continue
              sub=c2s.get(c,"—")
              L.append(f"| {c} | {r['name']} | {sub} | {MODEL.get(sub,'—')} | {r['yoy']:+.0f}% | {r['cum']:+.0f}% | {g[-3]:.1f}→{g[-2]:.1f}→{g[-1]:.1f} | {pxx:.1f} | {m20:.1f} | {m60:.1f} | {(m60/pxx-1)*100:.1f}% | {vol:.0f} |")
              cnt+=1
          if cnt==0: L.append("| — | 本週無標的同時通過 | | | | | | | | | | |")
          L.append(f"\n## 毛利率變化前後各 10 名（全對照表）\n")
          L.append("| 名稱 | 子產業 | 毛利率三季 | 變化 | 當月YoY | 距高 |")
          L.append("|---|---|---|---|---|---|")
          ind=[]
          for c in codes:
              g=[v for _,v in GM.get(c,[])]
              if len(g)<3: continue
              r=R.get(c); t=px(c)
              if not t: continue
              ind.append((g[-1]-g[-3],c,(r or {}).get("name",c),c2s.get(c,"—"),g[-3:],(r or {}).get("yoy"),(t[0]/t[3]-1)*100))
          ind.sort(reverse=True)
          for d,c,n_,sub,g,y,dh in ind[:10]+[(None,)*7]+ind[-10:]:
              if d is None: L.append("| *…* | | | | | |"); continue
              L.append(f"| {n_} | {sub} | {g[0]:.1f}→{g[1]:.1f}→{g[2]:.1f} | {d:+.1f}pt | {(f'{y:+.0f}%' if y is not None else '—')} | {dh:+.1f}% |")
          # 估值與推估目標價
          L.append("\n## 子產業本益比（相對估值錨點）\n")
          L.append("| 子產業 | 模式 | 家數 | PE中位 | PE區間 | PB中位 |")
          L.append("|---|---|---|---|---|---|")
          SUBPE={}
          for sub,cs in SUB.items():
              v=[PE[c] for c in cs if c in PE and 0<PE[c]<500]
              pb=[PB[c] for c in cs if c in PB and PB[c]>0]
              if len(v)<3: continue
              SUBPE[sub]=statistics.median(v)
              L.append(f"| {sub} | {MODEL.get(sub,'—')} | {len(v)} | {statistics.median(v):.1f} | {min(v):.1f}–{max(v):.1f} | {statistics.median(pb) if pb else 0:.2f} |")
          allv=[PE[c] for cs in SUB.values() for c in cs if c in PE and 0<PE[c]<500]
          mkt=[v for v in PE.values() if 0<v<500]
          L.append(f"\n對照表整體中位 **{statistics.median(allv):.1f}** 倍；全市場中位 {statistics.median(mkt):.1f} 倍；溢價 {statistics.median(allv)/statistics.median(mkt)*100-100:.0f}%\n")
          L.append("\n## 候選清單的相對估值與推估目標價\n")
          L.append("**方法**：近四季 EPS × 該子產業 PE 中位。這是「若回到同業平均估值」的錨點，**不是預測**。")
          L.append("回測顯示本益比閘門在本系統為負貢獻（PE≤25 報酬僅 +4.4%），此欄僅供理解市場定價，不作進出依據。\n")
          L.append("| 名稱 | 子產業 | 收盤 | 近四季EPS | 現行PE | 同業PE | 推估錨點 | 距錨點 | 出場線 | 停損 |")
          L.append("|---|---|---|---|---|---|---|---|---|---|")
          for c in codes:
              r=R.get(c); p=P.get(c)
              if not r or r.get("yoy") is None or not (30<=r["yoy"]<=300): continue
              if not p or p.get("yoy") is None or p["yoy"]<30: continue
              if (r.get("cum") or 0)<30: continue
              t=px(c)
              if not t: continue
              pxx,m20,m60,hi,vol=t
              if not (pxx>m20 and pxx>m60 and (pxx-m20)/m20<0.15 and vol>=500): continue
              sub=c2s.get(c,"—")
              ev=[v for _,v in EPS.get(c,[])][-4:]
              ttm=sum(ev) if len(ev)==4 else None
              spe=SUBPE.get(sub)
              anc=(ttm*spe) if (ttm and spe and ttm>0) else None
              L.append(f"| {r['name']} | {sub} | {pxx:.1f} | {(f'{ttm:.2f}' if ttm else '—')} | {(f'{PE[c]:.1f}' if c in PE else '—')} | {(f'{spe:.1f}' if spe else '—')} | {(f'{anc:.0f}' if anc else '—')} | {(f'{(anc/pxx-1)*100:+.0f}%' if anc else '—')} | {m60:.1f} | {(m60/pxx-1)*100:.1f}% |")
          # 800V 電源鏈追蹤（能力驗證分層，固定名單）
          L.append("\n## 800V HVDC 電源鏈追蹤\n")
          L.append("**背景**：NVIDIA 18 家 800V 合作夥伴中 10 家半導體業者全為外商（英飛凌/MPS/ADI/TI/ROHM/ST/英諾賽科/納微/安森美/瑞薩）。**800V 的 SiC/GaN 晶片本身，台灣一家都沒有。** 台廠角色：T1 電源系統（NVIDIA 官方夥伴）→ T2 SiC/GaN 材料與代工（供外商 IDM）→ T3 矽基 MOSFET 周邊 → T4 封裝材料/被動元件。")
          L.append("本表為數據面自動更新；「台廠是否進入 NVIDIA 800V 半導體夥伴名單」「漢磊 8吋 SiC Q4 驗證結果」等質化事件需人工確認（見 RESEARCH.md 追蹤清單）。\n")
          L.append("| 層級 | 名稱 | 市 | 當月YoY | 上月 | 累計 | 毛利率三季 | PE | 收盤 | 距60MA | 距高 | 第1條 | 第12條 |")
          L.append("|---|---|---|---|---|---|---|---|---|---|---|---|---|")
          PW=[("T1","2308","台達電"),("T1","2301","光寶科"),("T2","3707","漢磊"),("T2","3016","嘉晶"),("T2","6488","環球晶"),("T2","3211","順達"),
              ("T3","2481","強茂"),("T3","6693","廣閎科"),("T4","3026","禾伸堂"),("T4","2351","順德"),("T4","6548","長科"),("T4","5285","界霖")]
          for tier,c,n in PW:
              r=R.get(c); p=P.get(c); t=px(c)
              y=f"{r['yoy']:+.0f}%" if r and r.get("yoy") is not None else "—"
              yp=f"{p['yoy']:+.0f}%" if p and p.get("yoy") is not None else "—"
              cum=f"{r['cum']:+.0f}%" if r and r.get("cum") is not None else "—"
              g=[v for _,v in GM.get(c,[])][-3:]
              gs=f"{g[0]:.1f}→{g[1]:.1f}→{g[2]:.1f}" if len(g)>=3 else "—"
              r1 = "✓" if (r and p and r.get("yoy") is not None and p.get("yoy") is not None and 30<=r["yoy"]<=300 and p["yoy"]>=30 and (r.get("cum") or 0)>=30) else "✗"
              r12 = "✓" if (len(g)>=3 and g[-1]>g[-2]>g[-3]) else "✗"
              pe=f"{PE[c]:.0f}" if c in PE and 0<PE[c]<500 else "—"
              if t:
                  pxx,m20,m60,hi,vol=t
                  mk="市" if c in {x[0] for x in (j.get("data",[]) if isinstance(j,dict) else [])} else "櫃"
                  L.append(f"| {tier} | {n} | {mk} | {y} | {yp} | {cum} | {gs} | {pe} | {pxx:.1f} | {(pxx/m60-1)*100:+.1f}% | {(pxx/hi-1)*100:+.1f}% | {r1} | {r12} |")
              else:
                  L.append(f"| {tier} | {n} | — | {y} | {yp} | {cum} | {gs} | {pe} | — | — | — | {r1} | {r12} |")
          open("research/DATA.md","w").write("\n".join(L)+"\n")
          print("wrote research/DATA.md", cnt, "names pass Rule12")
          PY
      - name: coverage gap scan
        run: python3 research/coverage.py
      - name: news tracking
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
        run: python3 research/news.py
      - name: claude review (subscription token)
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        env: {CLAUDE_CODE_OAUTH_TOKEN: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}"}
        continue-on-error: true
        timeout-minutes: 25
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          export PATH="$HOME/.local/bin:$PATH"
          claude --version
          [ -f research/REVIEW.md ] && cp research/REVIEW.md research/REVIEW_prev.md
          TS="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          PROMPT="今天是 $(TZ=Asia/Taipei date '+%Y-%m-%d %A')（台灣時間）。
          $(cat research/review_prompt.md)"
          if claude -p "$PROMPT" --allowedTools "WebSearch" "WebFetch" "Read" --max-turns 80 > research/REVIEW.new.md 2> research/review_err.txt && [ -s research/REVIEW.new.md ]; then
            mv research/REVIEW.new.md research/REVIEW.md
            echo "_產生時間：${TS}_" >> research/REVIEW.md
            echo "$TS ok" >> research/review_log.txt
          else
            echo "$TS FAILED: $(tail -c 300 research/review_err.txt | tr '\n' ' ')" >> research/review_log.txt; rm -f research/REVIEW.new.md
          fi
          tail -n 60 research/review_log.txt > research/review_log.tmp && mv research/review_log.tmp research/review_log.txt
      - name: data health check
        if: always()
        env: {NTFY_TOPIC: "${{ secrets.NTFY_TOPIC }}"}
        run: python3 research/health.py
      - if: always()
        run: |
          git config user.name bot; git config user.email b@b.c
          git add research data/prices data/prices_otc2
          git diff --cached --quiet && exit 0
          git commit -m "daily research data $(TZ=Asia/Taipei date +%F)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
