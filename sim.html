<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<script src="gate.js?v=1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#EDEBF5">
<title>模擬帳戶｜家的旅程</title>
<style>
  :root{
    --paper:#EDEBF5; --card:#FFFFFF; --card2:#F2F0FA; --line:#DAD5EC;
    --ink:#3B3357; --mut:#655D82; --mut2:#7A7295;
    --chang:#4A90D9; --chang-soft:#DBEAF9; --green:#5FBF6E; --green-soft:#DFF3E2; --red:#D9534F; --red-soft:#FCE3E1;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;max-width:820px;margin:0 auto;padding:18px 16px 70px;-webkit-font-smoothing:antialiased}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .back{text-decoration:none;color:var(--mut);font-size:13px;font-weight:700;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px}
  .eyebrow{font-size:11px;letter-spacing:.35em;color:var(--mut2)}
  h1{font-size:22px;font-weight:900;margin:4px 0 2px;letter-spacing:.06em}
  .meta{font-size:12px;color:var(--mut);margin-bottom:12px;line-height:1.6}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 3px 0 var(--line)}
  h2{font-size:14px;font-weight:900;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:baseline;gap:8px}
  h2 small{font-weight:600;color:var(--mut);font-size:11px;letter-spacing:0}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{font-size:10.5px;color:var(--mut2);font-weight:700;text-align:left;padding:4px 4px;border-bottom:1.5px solid var(--line);white-space:nowrap}
  td{padding:6px 4px;border-bottom:1px dashed var(--line);vertical-align:top}
  td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
  tr.cur td{background:var(--chang-soft)}
  .up{color:#2E8B47;font-weight:700}.dn{color:var(--red);font-weight:700}
  .seg{display:flex;gap:3px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;margin:0 0 12px;overflow-x:auto}
  .seg button{flex:1;border:none;background:none;font:inherit;font-size:13px;font-weight:800;color:var(--mut);padding:8px 8px;border-radius:9px;cursor:pointer;white-space:nowrap}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line),0 1px 3px rgba(59,51,87,.12)}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 10px}
  .kpi{background:var(--card2);border-radius:12px;padding:8px 10px}
  .kpi .l{font-size:10.5px;color:var(--mut2);font-weight:700}
  .kpi .v{font-family:var(--mono);font-size:16px;font-weight:700;margin-top:2px}
  .rule{font-size:12px;color:var(--mut);line-height:1.6;background:var(--card2);border-radius:12px;padding:9px 11px;margin-bottom:10px}
  .tag{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--card2);color:var(--mut);border:1px solid var(--line);margin-left:4px;vertical-align:middle}
  .tag.buy{background:var(--green-soft);color:#2E8B47;border-color:transparent}.tag.sell{background:var(--red-soft);color:var(--red);border-color:transparent}
  .eqwrap{margin:4px 0 10px}
  svg{display:block;width:100%;height:120px}
  .note{font-size:12px;color:var(--mut);line-height:1.6}
  .why{font-size:11px;color:var(--mut)}
  @media(max-width:480px){.kpis{grid-template-columns:repeat(2,1fr)} td,th{padding:5px 3px}}
</style>
</head>
<body>
<div class="top"><a class="back" href="index.html">← 家的旅程</a><span class="eyebrow">PAPER ACCOUNTS</span></div>
<h1>新舊規則模擬帳戶</h1>
<div class="meta" id="meta">載入中…</div>
<div class="card" id="cmp"></div>
<div class="seg" id="seg"></div>
<div id="acct"></div>
<div class="note">資料來源：<code>paper/abtest.json</code>，每個交易日 15:30 後由「收盤更新」工作流程重算（每次從起始日重跑，決定性）。各帳戶 500 萬起、同一份營收名單、同一套進場閘門，訊號日收盤判斷、次日收盤成交，手續費 0.1425%、賣出含稅 0.4425%、每邊滑價 0.1%。主觀出場不模擬。</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const n=(v,d=0)=>(+v).toLocaleString("zh-Hant",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=v=>`<span class="${v>0?"up":v<0?"dn":""}">${v>0?"+":""}${(+v).toFixed(1)}%</span>`;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CASH0=5000000;
let D=null,CUR=null;
async function load(){
  for(const u of ["paper/abtest.json?t="+Date.now(),"https://raw.githubusercontent.com/kko3okk/family-dividend-web/main/paper/abtest.json?t="+Date.now()]){
    try{const r=await fetch(u,{cache:"no-store"});if(r.ok){D=await r.json();break;}}catch(e){}
  }
  if(!D){$("meta").textContent="讀不到模擬資料。";return;}
  const keys=Object.keys(D.accounts);
  CUR=localStorage.getItem("simAcct")&&keys.includes(localStorage.getItem("simAcct"))?localStorage.getItem("simAcct"):(keys.includes("G")?"G":keys[0]);
  render();
}
function stats(a){
  const e=a.equity.map(x=>x[1]);let pk=CASH0,mdd=0;for(const v of e){pk=Math.max(pk,v);mdd=Math.min(mdd,v/pk-1);}
  const t=a.trades,win=t.length?t.filter(x=>x.pnl>0).length/t.length:null;
  const last=e.length?e[e.length-1]:CASH0;
  const mv=a.positions.reduce((s,p)=>s+p.px*p.shares,0);
  return {ret:last/CASH0-1,mdd,n:t.length,win,equity:last,mv,cash:a.cash,pnl:t.reduce((s,x)=>s+x.pnl,0)};
}
function spark(a){
  const e=a.equity;if(e.length<2)return'<div class="note">資料還不到兩天，曲線明天開始畫。</div>';
  const W=640,H=120,P=6,vs=e.map(x=>x[1]),mn=Math.min(...vs,CASH0),mx=Math.max(...vs,CASH0);
  const x=i=>P+i*(W-2*P)/(e.length-1),y=v=>H-P-(v-mn)/((mx-mn)||1)*(H-2*P);
  const d=vs.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  const y0=y(CASH0).toFixed(1);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="權益曲線"><line x1="${P}" x2="${W-P}" y1="${y0}" y2="${y0}" stroke="#DAD5EC" stroke-dasharray="4 4"/><path d="${d}" fill="none" stroke="#4A90D9" stroke-width="2"/></svg>
  <div class="why" style="display:flex;justify-content:space-between"><span>${e[0][0]}</span><span>虛線＝起始 500 萬　最高 ${n(mx/1e4)} 萬／最低 ${n(mn/1e4)} 萬</span><span>${e[e.length-1][0]}</span></div>`;
}
function render(){
  const A=D.accounts,keys=Object.keys(A);
  $("meta").innerHTML=`自 ${D.start} 起，各 500 萬　·　最後更新 ${D.updated} 收盤　·　${keys.length} 個帳戶`;
  // 比較表
  $("cmp").innerHTML=`<h2>總覽 <small>點帳戶看明細</small></h2><table><tr><th>帳戶</th><th class="n">權益(萬)</th><th class="n">報酬</th><th class="n">MDD</th><th class="n">持股</th><th class="n">已出場</th><th class="n">勝率</th><th class="n">明日</th></tr>
  ${keys.map(k=>{const a=A[k],s=stats(a);return`<tr class="${k===CUR?"cur":""}" data-k="${k}" style="cursor:pointer"><td><b>${esc(a.cfg.name.split("（")[0])}</b><div class="why">${esc((a.cfg.name.match(/（(.*)）/)||[,""])[1])}</div></td><td class="n">${n(s.equity/1e4,1)}</td><td class="n">${pct(s.ret*100)}</td><td class="n">${(s.mdd*100).toFixed(1)}%</td><td class="n">${a.positions.length}/5</td><td class="n">${s.n}</td><td class="n">${s.win==null?"—":Math.round(s.win*100)+"%"}</td><td class="n">${a.pending_buy.length?`<span class="tag buy">買${a.pending_buy.length}</span>`:""}${a.pending_sell.length?`<span class="tag sell">賣${a.pending_sell.length}</span>`:""}${!a.pending_buy.length&&!a.pending_sell.length?"—":""}</td></tr>`;}).join("")}</table>`;
  $("cmp").querySelectorAll("tr[data-k]").forEach(tr=>tr.onclick=()=>{CUR=tr.dataset.k;try{localStorage.setItem("simAcct",CUR)}catch(e){}render();});
  $("seg").innerHTML=keys.map(k=>`<button data-k="${k}" class="${k===CUR?"on":""}">${esc(A[k].cfg.name.split(" ")[0])}</button>`).join("");
  $("seg").querySelectorAll("button").forEach(b=>b.onclick=()=>{CUR=b.dataset.k;try{localStorage.setItem("simAcct",CUR)}catch(e){}render();});
  const a=A[CUR],s=stats(a),cfg=a.cfg;
  const rule=[`進場：第 1–6、10、11 條${cfg.brk?`＋收盤突破前 ${cfg.brk} 日最高收盤`:""}`,
    `出場：${cfg.exit==="ma60"?"收盤跌破 60MA":"收盤跌破前 55 日最低收盤"}；T4 翻倍後自高點回落 25%${cfg.pt?`；曾賺 ${Math.round(cfg.pt[0]*100)}% 後自最高收盤回落 ${Math.round(cfg.pt[1]*100)}%`:""}${cfg.roll?`；曾賺 ${Math.round(cfg.roll[2]*100)}% 後、近 ${cfg.roll[0]} 日最高收盤回落 ${Math.round(cfg.roll[1]*100)}%`:""}`,
    cfg.addc?`加碼：${esc(JSON.stringify(cfg.addc))}`:"不加碼",`5 格 × 20%，訊號日收盤判斷、次日收盤成交`].join("　·　");
  const posRows=a.positions.length?a.positions.map(p=>`<tr><td><b>${esc(p.name)}</b> <span class="why">${p.code}</span>${a.pending_sell.includes(p.code)?'<span class="tag sell">明日賣</span>':""}</td><td class="n">${p.entry.slice(5)}</td><td class="n">${n(p.entry_px,1)}</td><td class="n">${n(p.px,1)}</td><td class="n">${pct(p.ret)}</td><td class="n">${n(p.shares)}</td><td class="n">${n(p.px*p.shares/1e4,1)}</td><td class="n">${p.line?n(p.line,1)+`<div class="why">${((p.line/p.px-1)*100).toFixed(0)}%</div>`:"—"}</td></tr>`).join("")
    :`<tr><td colspan="8" class="note">目前空手${a.pending_buy.length?"，明日收盤買進："+a.pending_buy.join("、"):""}</td></tr>`;
  const T=[...a.trades].reverse();
  const trRows=T.length?T.map(t=>`<tr><td><b>${esc(t.name)}</b> <span class="why">${t.code}</span><div class="why">${esc(t.why)}</div></td><td class="n">${t.entry.slice(5)}<div class="why">${n(t.entry_px,1)}</div></td><td class="n">${t.exit.slice(5)}<div class="why">${n(t.exit_px,1)}</div></td><td class="n">${pct(t.ret)}</td><td class="n ${t.pnl>0?"up":t.pnl<0?"dn":""}">${t.pnl>0?"+":""}${n(t.pnl/1e4,1)}</td></tr>`).join("")
    :`<tr><td colspan="5" class="note">還沒有出場紀錄。</td></tr>`;
  const eqRows=[...a.equity].reverse().slice(0,60).map((e,i,arr)=>{const prev=arr[i+1];const chg=prev?(e[1]/prev[1]-1)*100:null;return`<tr><td class="n" style="text-align:left">${e[0]}</td><td class="n">${n(e[1]/1e4,1)}</td><td class="n">${chg==null?"—":pct(chg)}</td><td class="n">${e[2]}</td></tr>`;}).join("");
  $("acct").innerHTML=`<div class="card"><h2>${esc(cfg.name)}</h2><div class="rule">${rule}</div>
    <div class="kpis"><div class="kpi"><div class="l">權益</div><div class="v">${n(s.equity/1e4,1)} 萬</div></div><div class="kpi"><div class="l">報酬</div><div class="v">${pct(s.ret*100)}</div></div><div class="kpi"><div class="l">最大回撤</div><div class="v">${(s.mdd*100).toFixed(1)}%</div></div><div class="kpi"><div class="l">已出場 / 勝率</div><div class="v">${s.n} 筆${s.win==null?"":" / "+Math.round(s.win*100)+"%"}</div></div>
    <div class="kpi"><div class="l">持股市值</div><div class="v">${n(s.mv/1e4,1)} 萬</div></div><div class="kpi"><div class="l">現金</div><div class="v">${n(s.cash/1e4,1)} 萬</div></div><div class="kpi"><div class="l">已實現損益</div><div class="v">${s.pnl>0?"+":""}${n(s.pnl/1e4,1)} 萬</div></div><div class="kpi"><div class="l">明日收盤待執行</div><div class="v" style="font-size:13px">${a.pending_buy.length?"買 "+a.pending_buy.join("、"):""}${a.pending_buy.length&&a.pending_sell.length?"<br>":""}${a.pending_sell.length?"賣 "+a.pending_sell.join("、"):""}${!a.pending_buy.length&&!a.pending_sell.length?"—":""}</div></div></div>
    <div class="eqwrap">${spark(a)}</div></div>
    <div class="card"><h2>持股 <small>${a.positions.length}/5 格</small></h2><table><tr><th>標的</th><th class="n">進場</th><th class="n">成本</th><th class="n">現價</th><th class="n">報酬</th><th class="n">股數</th><th class="n">市值(萬)</th><th class="n">出場線</th></tr>${posRows}</table></div>
    <div class="card"><h2>已出場 <small>${s.n} 筆，新的在上</small></h2><table><tr><th>標的／出場原因</th><th class="n">進場</th><th class="n">出場</th><th class="n">報酬</th><th class="n">損益(萬)</th></tr>${trRows}</table></div>
    <div class="card"><h2>每日權益 <small>最近 60 個交易日</small></h2><table><tr><th>日期</th><th class="n">權益(萬)</th><th class="n">日變動</th><th class="n">持股數</th></tr>${eqRows}</table></div>`;
}
load();
})();
</script>
</body>
</html>
