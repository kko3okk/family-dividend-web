<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FDF7E1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>購物清單｜【目的地】2027</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;background:#FDF7E1;color:#4E3418;padding:18px 16px 60px;max-width:760px;margin:0 auto;font-size:15px;line-height:1.6}
nav{display:flex;gap:6px;margin-bottom:16px}
nav a{flex:1;text-align:center;font-size:12.5px;white-space:nowrap;font-weight:600;padding:9px 0;border-radius:10px;background:#fff;text-decoration:none}
h1{font-size:18px}
.sub{font-size:12px;margin:2px 0 14px}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
.jx-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.jx-h2{font-size:17px!important;margin:4px 2px 10px}
.jx-shopsec{margin-bottom:6px}
.jx-shop-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.jx-prog{flex:1;min-width:140px;height:12px;border-radius:999px;background:var(--card,#fff);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line-c,#EFE2BD)}
.jx-prog i{display:block;height:100%;background:var(--green,#97CC27);border-radius:999px;transition:width .3s}
.jx-filters{display:flex;gap:6px}
.jx-filters .jx-btn[aria-pressed="true"]{background:var(--mustard,#DEAE0B);color:#fff}
.jx-grp{margin-bottom:12px}
.jx-grp h3{font-size:14px;margin:0 0 6px 4px;color:var(--brown,#5D3713)}
.jx-shop{background:var(--card,#fff);border-radius:22px;overflow:hidden;box-shadow:0 12px 30px -20px rgba(93,55,19,.45)}
.jx-si{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border-top:2px dotted var(--line-c,#EFE2BD);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font:inherit;color:inherit}
.jx-si:first-child{border-top:none}
.jx-ck{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2.5px solid var(--ink3,#AD9670);margin-top:1px;display:grid;place-items:center;font-size:13px;color:#fff}
.jx-si.done .jx-ck{background:var(--green,#97CC27);border-color:var(--green,#97CC27)}
.jx-si.done .jx-sn{text-decoration:line-through;color:var(--ink3,#AD9670)}
.jx-sn{font-weight:700;color:var(--brown,#5D3713)}
.jx-sj{font-size:12px;color:var(--ink2,#8A7150)}
.jx-sd{font-size:12px;color:var(--ink2,#8A7150);margin-top:2px}
.jx-sq{margin-left:auto;flex:0 0 auto;font-size:12px;color:var(--ink2,#8A7150);font-family:var(--num,inherit);padding-top:3px}
.jx-tab{border:none;border-radius:999px;background:var(--card,#fff);padding:10px 0;font-size:15px;font-weight:700;color:var(--ink2,#8A7150);box-shadow:0 4px 12px -8px rgba(93,55,19,.5)}
.jx-tab[aria-selected="true"]{background:var(--mustard,#DEAE0B);color:#fff}
.jx-days{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 12px;scrollbar-width:none}
.jx-days::-webkit-scrollbar{display:none}
.jx-day{flex:0 0 auto;border:none;border-radius:16px;background:var(--card,#fff);padding:4px 11px;font-size:13px;font-weight:700;line-height:1.25;text-align:center;color:var(--ink2,#8A7150);box-shadow:0 4px 10px -8px rgba(93,55,19,.5)}
.jx-day small{display:block;font-size:10.5px;font-weight:500;font-family:var(--num,inherit)}
.jx-day[aria-pressed="true"]{background:var(--green,#97CC27);color:#fff}
.jx-acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.jx-big{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:22px;padding:15px 8px;font-size:16px;font-weight:700;background:var(--mustard,#DEAE0B);color:#fff;box-shadow:0 10px 22px -14px rgba(93,55,19,.7);cursor:pointer}
.jx-big.alt{background:var(--card,#fff);color:var(--brown,#5D3713)}
.jx-big:active,.jx-btn:active{transform:scale(.97)}
.jx-btn{border:none;border-radius:999px;background:var(--card,#fff);padding:6px 13px;font-size:13px;font-weight:700;color:var(--brown,#5D3713);box-shadow:0 4px 10px -8px rgba(93,55,19,.6)}
.jx-btn.warm{background:var(--yama-l,#FBEFC4)}
.jx-btn.danger{background:var(--coral-l,#FBE3EA)}
.jx-btn[disabled]{opacity:.45}
.jx-stat{font-size:13px;color:var(--ink2,#8A7150);min-height:1.4em;margin:-2px 0 10px}
.jx-list{display:flex;flex-direction:column;gap:14px}
.jx-card{background:var(--card,#fff);border-radius:24px;overflow:hidden;box-shadow:0 12px 30px -20px rgba(93,55,19,.45)}
.jx-ph{display:block;width:100%;max-height:340px;object-fit:cover;background:var(--card2,#FBF3DA)}
.jx-body{padding:12px 15px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.jx-ttl{font-size:16.5px;font-weight:700;color:var(--brown,#5D3713);line-height:1.4}
.jx-meta{font-size:12px;color:var(--ink2,#8A7150);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.jx-pill{border-radius:999px;padding:0 9px;font-size:12px;background:var(--waka-l,#EEF6D6)}
.jx-ja{background:var(--mizu-l,#E2F1F3);border-radius:16px;padding:9px 12px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.jx-ja b{font-weight:700;color:var(--ink2,#8A7150);font-size:12px}
.jx-note{width:100%;border:none;border-radius:14px;padding:8px 11px;font-size:14px;resize:vertical;min-height:42px;background:var(--card2,#FBF3DA)}
.jx-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.jx-empty{border:2px dashed var(--line-c,#EFE2BD);border-radius:24px;padding:22px 16px;text-align:center;color:var(--ink2,#8A7150);font-size:14px}
.jx-diary{background:var(--yama-l,#FBEFC4);border-radius:24px;padding:13px 15px;margin-bottom:12px}
.jx-diary h2{font-size:15px;margin-bottom:6px}
.jx-diary p{white-space:pre-wrap;font-size:14.5px}
.jx-tots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.jx-tot{background:var(--card,#fff);border-radius:22px;padding:11px 14px;box-shadow:0 12px 30px -20px rgba(93,55,19,.45)}
.jx-tot .k{font-size:12px;color:var(--ink2,#8A7150)}
.jx-tot .v{font-size:23px;font-family:var(--num,inherit);font-weight:600;color:var(--brown,#5D3713);font-variant-numeric:tabular-nums;line-height:1.25}
.jx-tot .v small{font-size:12px;color:var(--ink2,#8A7150);font-weight:500}
.jx-bycard{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
.jx-amt{font-size:22px;font-family:var(--num,inherit);font-weight:600;color:var(--brown,#5D3713);text-align:right;font-variant-numeric:tabular-nums;line-height:1.2}
.jx-amt small{font-size:12px;color:var(--ink2,#8A7150);font-weight:500}
.jx-tw{overflow-x:auto;border-radius:14px;background:var(--card2,#FBF3DA)}
.jx-tw table{border-collapse:collapse;width:100%;font-size:13px;background:transparent!important;box-shadow:none!important}
.jx-tw th,.jx-tw td{padding:6px 9px;text-align:left;vertical-align:top;border-top:1.5px dotted var(--line-c,#EFE2BD)}
.jx-tw th{border-top:none;font-weight:700;white-space:nowrap;background:transparent!important}
.jx-tw .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.jx-tw .jp{display:block;font-size:11.5px;color:var(--ink2,#8A7150)}
.jx-sel,.jx-in{border:none;border-radius:12px;background:var(--card2,#FBF3DA);padding:5px 9px;font-size:13px}
.jx-in{width:100px}
.jx-ocr{font-size:12px;white-space:pre-wrap;background:var(--card2,#FBF3DA);border-radius:12px;padding:8px 10px;max-height:220px;overflow:auto;font-family:ui-monospace,Menlo,monospace}
.jx-panel{background:var(--card,#fff);border-radius:22px;padding:13px 15px;margin-bottom:12px;font-size:13px;box-shadow:0 12px 30px -20px rgba(93,55,19,.45)}
.jx-panel input[type=password],.jx-panel input[type=text]{width:100%;border:none;border-radius:12px;background:var(--card2,#FBF3DA);padding:8px 10px;font-size:13px;margin:6px 0}
.jx-fx{font-size:12px;color:var(--ink2,#8A7150);display:flex;gap:6px;align-items:center;justify-content:flex-end;margin:-2px 0 10px}
.jx-fx input{width:64px}
.jx-how{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.jx-how>div{background:var(--card2,#FBF3DA);border-radius:16px;padding:9px 11px;min-width:0}.jx-how ul{margin:4px 0 0 16px;font-size:12.5px;line-height:1.6}@media (max-width:420px){.jx-how{grid-template-columns:1fr}}
details summary{cursor:pointer;font-size:13px;color:var(--ink2,#8A7150)}
.jx-mode{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--waka-l,#EEF6D6)}
.jx-mode.off{background:var(--yama-l,#FBEFC4)}
</style>

<h1>購物清單</h1>
<div class="sub">這趟要買的東西｜跟 Claude 說「購物清單加：…」就會加進來</div>
<section id="paneS">
  <div class="jx-shop-top"><div class="jx-prog" aria-hidden="true"><i id="shopBar" style="width:0%"></i></div><span class="jx-meta" id="shopCnt">0 / 0 買到</span></div>
  <div class="jx-row" style="justify-content:space-between;margin-bottom:12px">
    <div class="jx-filters" id="shopF"><button class="jx-btn" data-f="todo" aria-pressed="true">還沒買</button><button class="jx-btn" data-f="all" aria-pressed="false">全部</button><button class="jx-btn" data-f="done" aria-pressed="false">已買到</button></div>
    <button class="jx-btn" id="shopRe">🔄</button>
  </div>
  <div id="shopList"></div>
  <p class="jx-meta" style="margin-top:8px">💡 跟 Claude 說「購物清單加：…」就會加進來。點一下＝買到（只存在這支手機）；說「○○買到了」或傳收據記帳，兩支手機都會勾掉。</p>
</section>

<script>
(function(){
const TRIP_ID='trip2027'; // 跟 index.html 的 TRIP.id 一樣
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
/* ===== 🛒 購物清單（shopping.json 由 Claude 維護；打勾存在這支手機） ===== */
const SHOPKEY=TRIP_ID+'_shop';
let shop=[], shopF='todo';
function ticks(){try{return JSON.parse(ls.get(SHOPKEY)||'{}')||{};}catch(e){return {};}}
function isDone(it,t){return (it.id in t)?!!t[it.id]:!!it.bought;}
async function loadShop(){
  try{const r=await fetch('shopping.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();shop=Array.isArray(j.items)?j.items:[];}
  catch(e){shop=[];}
  renderShop();
}
function renderShop(){
  const t=ticks(); const done=shop.filter(i=>isDone(i,t)).length;
  $('shopCnt').textContent=done+' / '+shop.length+' 買到'; $('shopBar').style.width=(shop.length?Math.round(done/shop.length*100):0)+'%';
  const list=shop.filter(i=>shopF==='all'||(shopF==='done')===isDone(i,t));
  const box=$('shopList');
  if(!shop.length){box.innerHTML='<div class="jx-empty">購物清單還是空的。<br>在 Claude App 的 Claude Code 對話說「購物清單加：寶可夢卡、樂敦眼藥水、白色戀人」，Claude 會分好類、寫上日文和建議在哪買。</div>';return;}
  if(!list.length){box.innerHTML='<div class="jx-empty">'+(shopF==='todo'?'全部買到了 🎉':'還沒有打勾的項目')+'</div>';return;}
  const groups={}; list.forEach(i=>{const g=i.cat||'其他';(groups[g]=groups[g]||[]).push(i);});
  box.innerHTML='';
  Object.keys(groups).forEach(g=>{
    const sec=document.createElement('div');sec.className='jx-grp';sec.innerHTML='<h3>'+esc(g)+'</h3>';
    const card=document.createElement('div');card.className='jx-shop';
    groups[g].forEach(i=>{
      const d=isDone(i,t); const b=document.createElement('button');b.type='button';b.className='jx-si'+(d?' done':'');b.setAttribute('aria-pressed',d);
      b.innerHTML='<span class="jx-ck">'+(d?'✓':'')+'</span><span style="min-width:0;flex:1"><span class="jx-sn">'+esc(i.name)+'</span>'+(i.ja?' <span class="jx-sj">'+esc(i.ja)+'</span>':'')+
        ((i.where||i.price||i.for)?'<div class="jx-sd">'+[i.where?'📍 '+esc(i.where):'',i.price?'💴 '+esc(i.price):'',i.for?'🎁 '+esc(i.for):''].filter(Boolean).join('｜')+'</div>':'')+
        (i.note?'<div class="jx-sd">'+esc(i.note)+'</div>':'')+'</span>'+(i.qty?'<span class="jx-sq">×'+esc(i.qty)+'</span>':'');
      b.onclick=()=>{const tt=ticks();tt[i.id]=!isDone(i,tt);ls.set(SHOPKEY,JSON.stringify(tt));renderShop();};
      card.appendChild(b);
    });
    sec.appendChild(card);box.appendChild(sec);
  });
}
$('shopF').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{shopF=b.dataset.f;$('shopF').querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b));renderShop();});
$('shopRe').onclick=()=>loadShop();
loadShop();
})();
</script>
<script src="../trip-kit/trip.js?v=2"></script>
